buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'

    }
}

plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = "${version_major}.${version_minor}.${version_patch}"

def gameTestClassesByScope = [
        smoke          : ['HumanSmokeGameTest'],
        persona        : ['HumanPersonaGameTest'],
        squad          : ['HumanSquadGameTest'],
        equipment      : ['HumanEquipmentGameTest'],
        chestloot      : ['HumanChestLootGameTest'],
        cobweb         : ['HumanCobwebGameTest'],
        shield         : ['HumanShieldGameTest'],
        sound          : ['HumanSoundGameTest', 'HumanSmokeGameTest'],
        worldnavigation: ['HumanWorldNavigationGameTest'],
        survival       : ['HumanSurvivalProgressionGameTest']
]
def requestedGameTestScopes = providers.gradleProperty('gameTestFilter').map { value ->
    value.split(',').collect { it.trim().toLowerCase(Locale.ROOT) }.findAll { !it.isEmpty() }
}

if (requestedGameTestScopes.isPresent()) {
    def unknownScopes = requestedGameTestScopes.get().findAll { !gameTestClassesByScope.containsKey(it) }
    if (!unknownScopes.isEmpty()) {
        throw new GradleException("Unknown gameTestFilter value(s): ${unknownScopes.join(', ')}. "
                + "Available values: ${gameTestClassesByScope.keySet().join(', ')}")
    }
}

base {
    archivesName = "${mod_id}_${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

compileJava { options.encoding = "UTF-8" }

minecraft {

    mappings channel: 'official', version: '1.20.1'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=mixins.hostile_humans.json"

            mods {
                hostile_humans {
                    source sourceSets.main
                }
            }

            // Required: Patchouli Mixin Support
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                hostile_humans {
                    source sourceSets.main
                }
            }

            // Required: Patchouli Mixin Support
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        gameTestServer {
            workingDirectory project.file('run/gametest')

            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.debug.export', 'false'
            property 'mixin.debug.verbose', 'false'

            mods {
                hostile_humans {
                    source sourceSets.main
                }
            }

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'hostile_humans', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                hostile_humans {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Curse Maven
repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 1.20.1-compatible runtime mods
    runtimeOnly fg.deobf("curse.maven:travelers-backpack-321117:6423948")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    runtimeOnly fg.deobf("curse.maven:villager-names-345854:5571624")
    runtimeOnly fg.deobf("curse.maven:collective-342584:6209646")

    // original path visualizer project stops at 1.19.x; use the maintained 1.20.1 fork
    runtimeOnly fg.deobf("curse.maven:mob-path-visualizer-1120194:5806831")

    // runtimeOnly fg.deobf("curse.maven:dungeon_mobs-428883:4344582")

    compileOnly "curse.maven:immersive_armors-580681:4362285"
    compileOnly "curse.maven:villager-names-345854:5571624"
    compileOnly "curse.maven:collective-342584:6209646"
    compileOnly "curse.maven:travelers-backpack-321117:6423948"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    compileOnly "curse.maven:dungeon_mobs-428883:4344582"
    compileOnly "curse.maven:farmersdelight-398521:4679315"

}


mixin {
    add sourceSets.main, 'mixins.hostile_humans.refmap.json'
    config 'mixins.hostile_humans.json'
    debug.verbose = true
    debug.export = true
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

}

tasks.named('compileJava', JavaCompile).configure {
    inputs.property('gameTestFilter', requestedGameTestScopes.map { it.join(',') }.orElse('all'))

    if (requestedGameTestScopes.isPresent()) {
        def selectedClasses = requestedGameTestScopes.get()
                .collectMany { gameTestClassesByScope[it] }
                .toSet()
        options.incremental = false
        exclude { details ->
            details.path.startsWith('com/craftix/hostile_humans/gametest/')
                    && !selectedClasses.contains(details.file.name - '.java')
        }
        doFirst {
            delete fileTree(destinationDirectory) {
                include 'com/craftix/hostile_humans/gametest/**'
            }
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


jar.finalizedBy('reobfJar')
